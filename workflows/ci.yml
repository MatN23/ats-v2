name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e .
      - run: pip install pytest pytest-timeout
      - run: pytest tests/ -x --timeout=300
      - run: python -c "import ats; from ats.config import load_config; load_config('configs/debug.yaml')"
      - run: python -m ats.cli.doctor || true
